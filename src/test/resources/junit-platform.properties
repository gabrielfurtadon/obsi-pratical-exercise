# Any test that hangs fails after 10 s instead of blocking the build (an uncrossing loop that never ends, say).
# SEPARATE_THREAD matters: in the default mode JUnit only interrupts the test thread, and a loop that never
# blocks ignores an interrupt, so the test would still hang.
junit.jupiter.execution.timeout.default = 10 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
